<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <script>!function(){var t=localStorage.getItem('dash_theme')||'dark';document.documentElement.setAttribute('data-theme',t);'dark'===t?document.documentElement.classList.add('dark'):document.documentElement.classList.remove('dark')}();</script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 投資委員會 | 投資報告中心</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>tailwind.config = { darkMode: 'class' }</script>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body class="flex min-h-screen transition-all" data-page="reports">

    <aside id="sidebar" class="w-64 border-r border-zinc-200 dark:border-zinc-900 flex flex-col fixed h-full transition-all"></aside>

    <main class="ml-64 flex-1 flex flex-col">

        <header class="h-16 border-b border-zinc-200 dark:border-zinc-900 flex items-center justify-between px-8 sticky top-0 backdrop-blur-md z-20">
            <div class="flex items-center gap-3">
                <i data-lucide="file-text" class="w-5 h-5 text-emerald-500"></i>
                <h2 id="reports-title" class="text-lg font-bold">投資報告中心</h2>
                <span id="reports-subtitle" class="text-[10px] font-bold text-zinc-500 uppercase tracking-widest hidden sm:block">Reports Center</span>
            </div>
            <div class="flex items-center gap-4">
                <span id="reports-meta" class="text-[11px] font-mono text-zinc-500"></span>
                <button id="reports-refresh"
                        class="bg-zinc-100 dark:bg-zinc-900 text-zinc-900 dark:text-white px-3 py-1.5 rounded-xl text-xs font-medium border border-zinc-200 dark:border-zinc-800 hover:bg-zinc-200 dark:hover:bg-zinc-800 transition-all flex items-center gap-2">
                    <i data-lucide="refresh-cw" class="w-3.5 h-3.5"></i>
                    <span id="reports-refresh-label">重新掃描</span>
                </button>
            </div>
        </header>

        <div class="flex-1 overflow-hidden">
            <div class="h-full grid" style="grid-template-columns: 360px 1fr; gap: 16px; padding: 16px;">

                <!-- LEFT: search + tabs + list -->
                <section class="glass-card flex flex-col overflow-hidden" style="min-height:0">
                    <div class="p-3 border-b border-zinc-200 dark:border-zinc-800 space-y-2">
                        <input id="reports-search" type="text"
                               class="w-full bg-zinc-50 dark:bg-zinc-950 border border-zinc-200 dark:border-zinc-800 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-emerald-500 transition-colors"
                               placeholder="搜尋 ticker / 檔名…">
                        <nav id="reports-tabs" class="flex flex-wrap gap-1.5"></nav>
                    </div>
                    <ul id="reports-items" class="flex-1 overflow-y-auto p-2 space-y-1">
                        <li class="text-xs text-zinc-500 p-4 text-center" id="reports-loading">載入中…</li>
                    </ul>
                </section>

                <!-- RIGHT: viewer -->
                <section class="glass-card flex flex-col overflow-hidden" style="min-height:0">
                    <div id="reports-empty" class="flex-1 flex flex-col items-center justify-center text-zinc-500 p-10 gap-3">
                        <i data-lucide="book-open" class="w-12 h-12"></i>
                        <p class="text-sm" id="reports-empty-msg">從左側選一份報告開啟</p>
                    </div>
                    <div id="reports-viewer-wrap" class="hidden flex-1 flex flex-col overflow-hidden">
                        <div id="reports-summary-card" class="hidden border-b border-zinc-200 dark:border-zinc-800 p-4"></div>
                        <div id="reports-degraded-banner" class="hidden"></div>
                        <div class="flex-1 overflow-y-auto p-6 grid" style="grid-template-columns: 1fr 200px; gap: 24px;">
                            <article id="reports-body" class="prose prose-sm max-w-none dark:prose-invert report-prose"></article>
                            <aside id="reports-toc" class="text-xs space-y-1 sticky top-0 self-start"></aside>
                        </div>
                    </div>
                </section>

            </div>
        </div>
    </main>

    <!-- Debug console (shared pattern) -->
    <div id="debug-console" class="hidden fixed bottom-0 right-4 w-[500px] max-w-[90vw] bg-zinc-950 border border-zinc-800 rounded-t-lg shadow-2xl z-50">
        <div class="flex items-center justify-between px-3 py-1.5 border-b border-zinc-800">
            <span class="text-[10px] font-bold uppercase tracking-widest text-zinc-500">System Logs</span>
            <button onclick="document.getElementById('debug-console').classList.add('hidden')" class="text-zinc-500 hover:text-red-500 text-sm">✕</button>
        </div>
        <div id="log-output" class="overflow-y-auto p-2 text-[10px] font-mono leading-normal space-y-0.5"></div>
    </div>

    <script src="i18n.js"></script>
    <script src="utils.js"></script>
    <script src="page-reports.js"></script>
</body>
</html>
