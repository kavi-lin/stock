<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <script>!function(){var t=localStorage.getItem('dash_theme')||'dark';document.documentElement.setAttribute('data-theme',t);'dark'===t?document.documentElement.classList.add('dark'):document.documentElement.classList.remove('dark')}();</script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 辦公室 | AI 投資委員會</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>tailwind.config = { darkMode: 'class' }</script>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;900&family=JetBrains+Mono:wght@400;500;700;800;900&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
      .of-input {
        width: 100%; resize: vertical; min-height: 64px;
        background: var(--bg-card); border: 1px solid rgba(161,161,170,0.25);
        border-radius: 12px; padding: 12px 14px; font-size: 13px; color: var(--text-main);
        font-family: Inter, sans-serif; line-height: 1.5;
      }
      .of-input:focus { outline: none; border-color: #3b82f6; }
      .of-status-bar {
        display: flex; gap: 10px; align-items: center; flex-wrap: wrap;
        padding: 8px 14px; border-radius: 10px; background: var(--bg-card);
        border: 1px solid rgba(161,161,170,0.18); margin: 12px 0; font-size: 11px;
      }
      .of-pill {
        display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px;
        border-radius: 999px; font-weight: 700; font-size: 10px; letter-spacing: .04em;
        text-transform: uppercase; border: 1px solid rgba(161,161,170,0.3);
      }
      .of-pill.running { background: rgba(59,130,246,.12); border-color: rgba(59,130,246,.4); color: #60a5fa; }
      .of-pill.done    { background: rgba(34,197,94,.12);  border-color: rgba(34,197,94,.4);  color: #4ade80; }
      .of-pill.stopped { background: rgba(161,161,170,.14); color: var(--text-muted); }
      .of-pill.failed  { background: rgba(239,68,68,.12); border-color: rgba(239,68,68,.4); color: #f87171; }
      .of-card {
        border: 1px solid rgba(161,161,170,0.2); border-left-width: 4px;
        border-radius: 12px; padding: 14px 16px; margin-bottom: 12px;
        background: var(--bg-card);
      }
      .of-card.lead     { border-left-color: #3b82f6; }
      .of-card.critic   { border-left-color: #f59e0b; }
      .of-card.verifier { border-left-color: #22c55e; }
      .of-card.trader   { border-left-color: #ec4899; }
      .of-card.researcher { border-left-color: #14b8a6; }
      .of-role { font-weight: 800; font-size: 13px; }
      .of-role.lead { color: #60a5fa; } .of-role.critic { color: #fbbf24; } .of-role.verifier { color: #4ade80; } .of-role.trader { color: #f472b6; } .of-role.researcher { color: #2dd4bf; }
      .of-badge {
        font-size: 9px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em;
        padding: 2px 7px; border-radius: 999px; background: rgba(161,161,170,0.15);
        color: var(--text-muted);
      }
      .of-badge.done { background: rgba(34,197,94,.15); color: #4ade80; }
      .of-summary { font-size: 13px; font-weight: 600; margin: 6px 0; color: var(--text-main); }
      .of-detail { font-size: 12.5px; color: var(--text-muted); line-height: 1.6; }
      .of-detail p { margin: 4px 0; } .of-detail ul { margin: 4px 0 4px 18px; list-style: disc; }
      .of-detail code { background: rgba(161,161,170,0.15); padding: 1px 5px; border-radius: 5px; font-size: 11px; }
      .of-concerns { margin-top: 8px; font-size: 11px; color: #fbbf24; }
      .of-round-sep { display: flex; align-items: center; gap: 10px; margin: 14px 0 8px; }
      .of-round-sep::before, .of-round-sep::after { content: ''; flex: 1; height: 1px; background: rgba(161,161,170,0.2); }
      .of-round-sep span { font-size: 10px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: .08em; }
      .of-deliverable {
        border: 1px solid rgba(34,197,94,0.35); border-radius: 14px; padding: 18px 20px;
        background: rgba(34,197,94,0.05); margin-top: 16px;
      }
      .of-deliverable h1, .of-deliverable h2, .of-deliverable h3 { font-weight: 800; margin: 10px 0 6px; }
      .of-deliverable p { margin: 6px 0; line-height: 1.6; } .of-deliverable ul { margin: 6px 0 6px 20px; list-style: disc; }
      .of-deliverable code { background: rgba(161,161,170,0.15); padding: 1px 5px; border-radius: 5px; }
      .of-btn {
        display: inline-flex; align-items: center; gap: 6px; padding: 7px 14px;
        border-radius: 10px; font-size: 12px; font-weight: 600; cursor: pointer;
        border: 1px solid rgba(161,161,170,0.3); background: transparent; color: var(--text-muted);
      }
      .of-btn.primary { background: #3b82f6; border-color: #3b82f6; color: #fff; }
      .of-btn.primary:disabled { opacity: .5; cursor: not-allowed; }
      .of-btn.danger:hover { border-color: #ef4444; color: #ef4444; }
      .of-runs select { background: var(--bg-card); border: 1px solid rgba(161,161,170,0.25); border-radius: 8px; padding: 4px 8px; font-size: 11px; color: var(--text-main); }
      .of-thinking { font-size: 11px; color: var(--text-muted); font-style: italic; padding: 6px 0; }
    </style>
</head>
<body class="flex min-h-screen transition-all" data-page="office">

    <aside id="sidebar" class="w-64 border-r border-zinc-200 dark:border-zinc-900 flex flex-col fixed h-full transition-all"></aside>

    <main class="ml-64 flex-1 flex flex-col">
        <header class="h-16 border-b border-zinc-200 dark:border-zinc-900 flex items-center justify-between px-8 sticky top-0 backdrop-blur-md z-10">
            <div class="flex items-center gap-3">
                <i data-lucide="building-2" class="w-5 h-5 text-blue-400"></i>
                <h2 class="text-lg font-bold">AI 辦公室</h2>
                <span class="text-[10px] font-bold text-zinc-500 uppercase tracking-widest hidden sm:block">Autonomous Multi-Agent Team</span>
            </div>
            <div class="of-runs flex items-center gap-2 text-xs text-zinc-500">
                <span>歷史</span>
                <select id="of-run-select"><option value="">— 新任務 —</option></select>
            </div>
        </header>

        <div class="flex-1 p-8 pt-6 max-w-4xl w-full mx-auto">
            <div class="flex items-center gap-2 mb-2 flex-wrap">
                <span id="of-role-pills" class="contents">
                    <span class="of-pill researcher" style="border-color:#14b8a6;color:#2dd4bf">Researcher · Broker</span>
                    <span class="of-pill lead" style="border-color:#3b82f6;color:#60a5fa">Lead · Broker</span>
                    <span class="of-pill critic" style="border-color:#f59e0b;color:#fbbf24">Critic · Broker</span>
                    <span class="of-pill verifier" style="border-color:#22c55e;color:#4ade80">Verifier · Broker</span>
                </span>
                <span class="of-pill" style="border-color:#a855f7;color:#c084fc">裁決 · Broker</span>
                <span class="text-[10px] text-zinc-500">Broker 蒐集資料 → 三方平行起草 → 分歧萃取 → 定點交鋒 → Broker 裁決</span>
            </div>

            <textarea id="of-task" class="of-input" placeholder="輸入任務，例如：「研究 2026 記憶體產業供需，列出 3 個多空關鍵變數並各給佐證」。團隊會自動分工跑到收斂。"></textarea>
            <div class="flex items-center gap-3 mt-3">
                <button id="of-start" class="of-btn primary"><i data-lucide="play" class="w-3.5 h-3.5"></i> 啟動團隊</button>
                <button id="of-stop" class="of-btn danger hidden"><i data-lucide="square" class="w-3.5 h-3.5"></i> 停止</button>
                <span id="of-err" class="text-xs text-red-400"></span>
            </div>

            <div id="of-statusbar" class="of-status-bar hidden">
                <span id="of-status-pill" class="of-pill">—</span>
                <span id="of-status-meta" class="text-zinc-500"></span>
            </div>

            <div id="of-board"></div>
            <div id="of-deliverable-wrap" class="hidden">
                <div class="of-round-sep"><span>📦 交付物</span></div>
                <div id="of-deliverable" class="of-deliverable"></div>
            </div>
        </div>
    </main>

    <script src="i18n.js"></script>
    <script src="utils.js"></script>
    <script src="page-office.js"></script>
</body>
</html>
