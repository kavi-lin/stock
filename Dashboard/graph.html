<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <script>!function(){var t=localStorage.getItem('dash_theme')||'dark';document.documentElement.setAttribute('data-theme',t);'dark'===t?document.documentElement.classList.add('dark'):document.documentElement.classList.remove('dark')}();</script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 投資委員會 | 知識圖譜</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>tailwind.config = { darkMode: 'class' }</script>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;900&family=JetBrains+Mono:wght@400;500;700;800;900&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://unpkg.com/force-graph@1.43"></script>

    <style>
        /* Nexus follows the dashboard theme; dark keeps the deep-space treatment. */
        .ng-canvas {
            background-color: #050609;
            background-image:
                radial-gradient(circle at 1px 1px, rgba(161,161,170,0.07) 1px, transparent 0);
            background-size: 36px 36px;
            position: relative;
            overflow: hidden;
            min-height: 0;       /* allow flex child to shrink properly */
        }
        .ng-canvas::after {
            content: '';
            position: absolute; inset: 0; pointer-events: none;
            background: radial-gradient(ellipse at center, transparent 35%, #050609 92%);
            opacity: 0.85;
        }
        [data-theme='light'] .ng-canvas {
            background-color: #f5f2ed;
            background-image:
                radial-gradient(circle at 1px 1px, rgba(120,113,108,0.16) 1px, transparent 0);
        }
        [data-theme='light'] .ng-canvas::after {
            background: radial-gradient(ellipse at center, transparent 42%, rgba(231,229,228,0.72) 100%);
            opacity: 0.68;
        }

        /* Side panels stay readable on dark canvas */
        .ng-side {
            background: rgba(16, 17, 21, 0.86) !important;
            color: #e4e4e7;
        }
        .ng-side label, .ng-side h3, .ng-side h4 { color: #d4d4d8; }
        .ng-side .text-zinc-500 { color: #a1a1aa !important; }
        [data-theme='light'] .ng-side {
            background: rgba(255,255,255,0.88) !important;
            color: #292524;
            border-color: rgba(120,113,108,0.22);
            box-shadow: 0 10px 30px rgba(41,37,36,0.08);
        }
        [data-theme='light'] .ng-side label,
        [data-theme='light'] .ng-side h3,
        [data-theme='light'] .ng-side h4 { color: #44403c; }
        [data-theme='light'] .ng-side .text-zinc-500 { color: #78716c !important; }

        #graph-host {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
        }
        #graph-host canvas { display: block; }

        .ng-side {
            backdrop-filter: blur(10px);
            background: color-mix(in srgb, var(--bg-card) 92%, transparent);
            border: 1px solid rgba(161,161,170,0.18);
        }

        .ng-stat-num {
            font-family: 'JetBrains Mono', monospace;
            font-variant-numeric: tabular-nums;
            font-weight: 800;
        }

        .ng-chip {
            display: inline-flex; align-items: center; gap: 4px;
            font-size: 10px; font-weight: 700;
            padding: 2px 8px;
            border-radius: 999px;
            border: 1px solid rgba(161,161,170,0.30);
            text-transform: uppercase;
            letter-spacing: 0.06em;
            color: var(--text-muted);
        }
        .ng-chip[data-type='ticker']     { color: #93c5fd; border-color: rgba(147,197,253,0.30); }
        .ng-chip[data-type='theme']      { color: #fbbf24; border-color: rgba(251,191,36,0.30); }
        .ng-chip[data-type='catalyst']   { color: #f87171; border-color: rgba(248,113,113,0.30); }
        .ng-chip[data-type='sector']     { color: #a78bfa; border-color: rgba(167,139,250,0.30); }
        .ng-chip[data-type='narrative']  { color: #34d399; border-color: rgba(52,211,153,0.30); }
        .ng-chip[data-type='thesis']     { color: #f472b6; border-color: rgba(244,114,182,0.30); }

        /* V4.3.0 — clickable edge-type toggle chips */
        .ng-edge-chip {
            font-size: 10px; font-weight: 700;
            padding: 2px 8px; margin: 0 4px 4px 0;
            border-radius: 999px;
            border: 1px solid var(--chip);
            color: var(--chip);
            background: transparent;
            cursor: pointer;
            transition: opacity 0.15s;
        }
        .ng-edge-chip.off { opacity: 0.25; border-style: dashed; }
        .ng-depth-btn {
            flex: 1; font-size: 10px; font-weight: 900;
            padding: 4px 0; border-radius: 6px;
            border: 1px solid rgba(161,161,170,0.3);
            color: #a1a1aa; cursor: pointer;
        }
        .ng-depth-btn.active { border-color: #3b82f6; color: #60a5fa; background: rgba(59,130,246,0.12); }
        [data-theme='light'] .ng-depth-btn { color: #57534e; border-color: rgba(120,113,108,.3); }
        [data-theme='light'] .ng-depth-btn.active { color: #1d4ed8; background: rgba(37,99,235,.08); }
        .ng-theme-chip {
            background: rgba(251,191,36,0.12); color: #fbbf24;
            border: 1px solid rgba(251,191,36,0.30);
            border-radius: 4px; padding: 1px 6px;
            font-size: 10px; font-weight: 600; cursor: pointer;
        }
        .ng-theme-chip:hover { background: rgba(251,191,36,0.25); }

        .ng-neighbor-row {
            display: flex; align-items: center; justify-content: space-between;
            font-size: 11px;
            padding: 4px 8px;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.15s;
        }
        .ng-neighbor-row:hover { background: rgba(59,130,246,0.10); }
        .ng-neighbor-row .label { font-family: 'JetBrains Mono', monospace; font-weight: 600; }
        .ng-neighbor-row .weight { font-family: 'JetBrains Mono', monospace; color: #71717a; }

        .ng-search-input {
            background: var(--bg-card);
            border: 1px solid rgba(161,161,170,0.25);
            border-radius: 8px;
            padding: 8px 12px;
            font-size: 12px;
            color: var(--text-main);
            width: 100%;
        }
        .ng-search-input:focus { outline: 2px solid rgba(59,130,246,0.4); }

        /* Nexus Intelligence Radar — readable landing view before the network. */
        .ng-radar-shell {
            position: absolute; inset: 24px 28px 28px; z-index: 18;
            overflow: auto; padding: 22px;
            border: 1px solid rgba(96,165,250,0.22); border-radius: 18px;
            background:
                radial-gradient(circle at 82% 5%, rgba(59,130,246,0.13), transparent 34%),
                rgba(8,10,15,0.94);
            backdrop-filter: blur(16px);
            box-shadow: 0 24px 80px rgba(0,0,0,0.45);
        }
        .ng-radar-grid {
            display: grid; grid-template-columns: repeat(auto-fit,minmax(230px,1fr));
            gap: 10px;
        }
        .ng-radar-card {
            text-align: left; min-height: 132px; padding: 13px;
            border: 1px solid rgba(161,161,170,0.16); border-radius: 12px;
            background: rgba(24,24,27,0.72); color: #e4e4e7;
            transition: transform .16s ease, border-color .16s ease, background .16s ease;
        }
        .ng-radar-card:hover {
            transform: translateY(-2px); border-color: rgba(96,165,250,0.62);
            background: rgba(30,41,59,0.78);
        }
        .ng-radar-state {
            display: inline-flex; padding: 2px 6px; border-radius: 999px;
            font: 800 9px 'JetBrains Mono',monospace; letter-spacing: .05em;
            color: #86efac; border: 1px solid rgba(34,197,94,.35);
            background: rgba(34,197,94,.08); text-transform: uppercase;
        }
        .ng-draft-badge {
            display: inline-flex; align-items: center; gap: 4px;
            padding: 2px 7px; border-radius: 999px;
            font: 800 9px 'JetBrains Mono',monospace; letter-spacing: .04em;
            color: #93c5fd; border: 1px solid rgba(59,130,246,.3);
            background: rgba(59,130,246,.08); text-transform: uppercase;
        }
        .ng-draft-layer {
            padding: 6px 8px; border-radius: 8px;
            border: 1px solid rgba(161,161,170,.16); background: rgba(24,24,27,.48);
        }
        .ng-radar-metric {
            padding: 8px 10px; border-radius: 9px; min-width: 105px;
            border: 1px solid rgba(161,161,170,.14); background: rgba(24,24,27,.6);
        }
        [data-theme='light'] .ng-radar-shell {
            border-color: rgba(37,99,235,.18);
            background:
                radial-gradient(circle at 82% 5%, rgba(59,130,246,.09), transparent 34%),
                rgba(250,250,249,.94);
            box-shadow: 0 22px 60px rgba(41,37,36,.13);
        }
        [data-theme='light'] .ng-radar-card {
            border-color: rgba(120,113,108,.18);
            background: rgba(255,255,255,.9);
            color: #292524;
            box-shadow: 0 2px 10px rgba(41,37,36,.035);
        }
        [data-theme='light'] .ng-radar-card:hover {
            border-color: rgba(37,99,235,.46);
            background: #fff;
            box-shadow: 0 10px 24px rgba(41,37,36,.08);
        }
        [data-theme='light'] .ng-radar-metric {
            border-color: rgba(120,113,108,.16);
            background: rgba(255,255,255,.82);
        }
        [data-theme='light'] .ng-radar-state {
            color: #15803d; border-color: rgba(21,128,61,.25); background: rgba(21,128,61,.07);
        }
        [data-theme='light'] .ng-draft-badge {
            color: #1d4ed8; border-color: rgba(37,99,235,.24); background: rgba(37,99,235,.06);
        }
        [data-theme='light'] .ng-draft-layer {
            border-color: rgba(120,113,108,.17); background: rgba(250,250,249,.9);
        }
        [data-theme='light'] .ng-radar-shell .text-zinc-300 { color: #57534e !important; }
        [data-theme='light'] .ng-radar-shell .text-zinc-500 { color: #78716c !important; }
        [data-theme='light'] .ng-radar-shell .text-emerald-300 { color: #15803d !important; }
        [data-theme='light'] .ng-radar-shell .text-blue-300 { color: #1d4ed8 !important; }
        [data-theme='light'] .ng-radar-shell .text-rose-300 { color: #be123c !important; }
        [data-theme='light'] .ng-radar-shell .text-amber-300 { color: #b45309 !important; }
        [data-theme='light'] #ng-radar-close { color: #44403c; border-color: #d6d3d1; }
        [data-theme='light'] #ng-open-radar { color: #1d4ed8; }
        @media (max-width: 900px) {
            .ng-radar-shell { inset: 16px; padding: 15px; }
        }
    </style>
</head>
<body class="flex transition-all" data-page="graph" style="height:100vh;overflow:hidden">

    <aside id="sidebar" class="w-64 border-r border-zinc-200 dark:border-zinc-900 flex flex-col fixed h-full transition-all" style="z-index:30"></aside>

    <main class="ml-64 flex-1 flex flex-col" style="height:100vh">

        <header class="h-16 border-b border-zinc-200 dark:border-zinc-900 flex items-center justify-between px-8 sticky top-0 backdrop-blur-md z-20" style="background-color:var(--bg-main)">
            <div class="flex items-center gap-3">
                <i data-lucide="network" class="w-5 h-5 text-blue-500"></i>
                <h2 id="ng-title" class="text-lg font-bold">知識圖譜</h2>
                <span class="text-[10px] font-bold text-zinc-500 uppercase tracking-widest hidden sm:block">Project Nexus</span>
                <span id="ng-version-chip" class="text-[9px] font-mono text-zinc-500 hidden md:inline">v3.0.0</span>
            </div>
            <div class="flex items-center gap-3">
                <span id="ng-meta-line" class="text-[10px] font-mono text-zinc-500"></span>
            </div>
        </header>

        <div class="flex-1 ng-canvas relative">
            <!-- collapsible left side panel -->
            <button id="ng-side-toggle" class="absolute top-4 left-4 z-20 rounded-md px-2 py-1 text-[10px] font-black uppercase tracking-widest ng-side hover:border-blue-400" title="收合 / 展開 控制台">
                <i data-lucide="panel-left" class="w-3.5 h-3.5 inline-block align-middle"></i>
            </button>

            <div id="ng-side-panel" class="absolute top-14 left-4 w-64 max-h-[calc(100vh-8rem)] overflow-y-auto p-3 rounded-xl ng-side z-10 space-y-3 transition-transform">
                <div>
                    <label class="text-[10px] font-black uppercase tracking-widest text-zinc-500">搜尋節點</label>
                    <input id="ng-search" class="ng-search-input mt-1" placeholder="ticker / 主題…" autocomplete="off" list="ng-search-list" />
                    <datalist id="ng-search-list"></datalist>
                </div>

                <div>
                    <label class="text-[10px] font-black uppercase tracking-widest text-zinc-500 block mb-1">關係類型（點擊開關）</label>
                    <div id="ng-edge-chips"></div>
                </div>

                <div>
                    <label class="text-[10px] font-black uppercase tracking-widest text-zinc-500 block mb-1">結構邊權重門檻</label>
                    <input id="ng-weight" type="range" min="0" max="2.5" step="0.1" value="0" class="w-full" />
                    <div class="text-[10px] font-mono text-zinc-500 flex justify-between">
                        <span>全部</span><span id="ng-weight-readout">≥ 0.0</span><span>僅強連結</span>
                    </div>
                </div>

                <div>
                    <label class="text-[10px] font-black uppercase tracking-widest text-zinc-500 block mb-1">聚焦深度</label>
                    <div class="flex gap-2">
                        <button class="ng-depth-btn active" data-focus-depth="1">1 hop</button>
                        <button class="ng-depth-btn" data-focus-depth="2">2 hop</button>
                    </div>
                </div>

                <div class="flex gap-2">
                    <button id="ng-zoom-fit" class="flex-1 text-[10px] font-black uppercase tracking-widest px-2 py-1.5 rounded border border-zinc-600/40 hover:border-blue-400 hover:text-blue-400">置中</button>
                    <button id="ng-reset" class="flex-1 text-[10px] font-black uppercase tracking-widest px-2 py-1.5 rounded border border-zinc-600/40 hover:border-rose-400 hover:text-rose-400">重設</button>
                </div>

                <button id="ng-open-radar" class="w-full text-[10px] font-black uppercase tracking-widest px-2 py-2 rounded border border-blue-500/40 text-blue-300 hover:bg-blue-500/10">
                    ✦ Topic Radar
                </button>

                <div class="text-[10px] text-zinc-500 leading-relaxed">
                    🟡 主題 hub・🔵 個股<br/>
                    點節點 → 聚焦該星系（ESC / 點背景返回）<br/>
                    背景拖曳 = 平移 / 滾輪 = 縮放
                </div>
            </div>

            <!-- V4.3.0 — focus-mode breadcrumb -->
            <div id="ng-breadcrumb" class="hidden absolute top-4 left-1/2 -translate-x-1/2 z-20 px-3 py-1.5 rounded-lg ng-side text-[11px] flex items-center gap-1.5"></div>

            <!-- right detail panel (populated on click) -->
            <div id="ng-detail" class="hidden absolute top-14 right-4 w-80 max-h-[calc(100vh-8rem)] overflow-y-auto p-3 rounded-xl ng-side z-10 space-y-3"></div>

            <!-- Nexus vNext — default intelligence landing; cards drill into an ego subgraph. -->
            <section id="ng-radar" class="ng-radar-shell hidden" aria-label="Nexus topic radar"></section>

            <!-- graph host -->
            <div id="graph-host"></div>

            <!-- loading / error states -->
            <div id="ng-status" class="absolute inset-0 flex items-center justify-center text-zinc-500 text-sm pointer-events-none">
                <div class="text-center">
                    <i data-lucide="loader-circle" class="w-8 h-8 mx-auto animate-spin opacity-60"></i>
                    <div class="mt-2">載入 Nexus 圖譜中…</div>
                </div>
            </div>
        </div>
    </main>

    <script src="i18n.js"></script>
    <script src="utils.js"></script>
    <script src="components.js"></script>
    <script src="page-graph.js"></script>
</body>
</html>
