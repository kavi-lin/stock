<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <script>!function(){var t=localStorage.getItem('dash_theme')||'dark';document.documentElement.setAttribute('data-theme',t);'dark'===t?document.documentElement.classList.add('dark'):document.documentElement.classList.remove('dark')}();</script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 投資委員會 | 投資方案</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>tailwind.config = { darkMode: 'class' }</script>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="flex min-h-screen transition-all" data-page="playbook">

    <aside id="sidebar" class="w-64 border-r border-zinc-200 dark:border-zinc-900 flex flex-col fixed h-full transition-all"></aside>

    <main class="ml-64 flex-1 flex flex-col min-w-0">
        <header class="h-16 border-b border-zinc-200 dark:border-zinc-900 flex items-center justify-between px-8 sticky top-0 backdrop-blur-md z-20">
            <div class="flex items-center gap-3">
                <i data-lucide="wallet" class="w-5 h-5 text-emerald-500"></i>
                <h2 class="text-lg font-bold" id="pb-title">投資方案</h2>
                <span class="text-[10px] font-bold text-zinc-500 uppercase tracking-widest hidden sm:block">Weekly Tech Playbook</span>
                <span class="experimental-badge">
                    <i data-lucide="flask-conical" class="w-3 h-3"></i>
                    <span>前瞻探索層</span>
                </span>
            </div>
            <div class="flex items-center gap-3">
                <span id="pb-asof" class="text-[10px] font-mono text-zinc-500"></span>
                <button id="pb-generate-btn" class="flex items-center gap-1.5 bg-emerald-600 hover:bg-emerald-500 text-white font-bold px-3 py-1.5 rounded-lg text-xs transition-all disabled:opacity-50 disabled:cursor-not-allowed">
                    <i data-lucide="refresh-cw" class="w-3.5 h-3.5"></i>
                    <span id="pb-generate-label">產生本週方案</span>
                </button>
                <div class="flex items-center gap-1 text-[10px]" id="pb-basket-toggle">
                    <button data-basket="all"          class="sort-toggle active px-2 py-0.5 rounded">全部</button>
                    <button data-basket="conservative" class="sort-toggle px-2 py-0.5 rounded">🛡️ 保險</button>
                    <button data-basket="aggressive"   class="sort-toggle px-2 py-0.5 rounded">🔥 激進</button>
                    <button data-basket="hybrid"        class="sort-toggle px-2 py-0.5 rounded">⚖️ 混合</button>
                </div>
            </div>
        </header>

        <div class="flex-1 overflow-y-auto p-6 space-y-5">

            <div id="pb-no-data" class="hidden">
                <div class="glass-card p-10 text-center space-y-3">
                    <i data-lucide="wallet" class="w-12 h-12 mx-auto text-zinc-500"></i>
                    <div class="text-sm text-zinc-500" id="pb-no-data-text">尚無投資方案。點下方按鈕一鍵產生本週三籃方案。</div>
                    <button id="pb-generate-btn-empty" class="inline-flex items-center gap-1.5 bg-emerald-600 hover:bg-emerald-500 text-white font-bold px-4 py-2 rounded-lg text-sm transition-all disabled:opacity-50 disabled:cursor-not-allowed">
                        <i data-lucide="refresh-cw" class="w-4 h-4"></i>
                        <span id="pb-generate-label-empty">產生本週方案</span>
                    </button>
                    <code class="text-[10px] text-zinc-600 block">python3 skills/weekly-tech-playbook/scripts/build_pack.py &amp;&amp; … &amp;&amp; render.py</code>
                </div>
            </div>

            <!-- Macro context bar -->
            <section id="pb-macro" class="glass-card p-4 hidden"></section>

            <!-- Codex review: original report vs review annotations -->
            <section id="pb-codex-review" class="glass-card p-4 hidden"></section>

            <!-- Last review banner (only when a past playbook has been scored) -->
            <section id="pb-lastreview" class="glass-card p-4 hidden"></section>

            <!-- Baskets -->
            <div id="pb-baskets" class="grid grid-cols-1 2xl:grid-cols-3 gap-5"></div>

            <!-- Review scaffold note -->
            <section id="pb-review" class="glass-card p-4 hidden"></section>

        </div>
    </main>

    <script src="i18n.js"></script>
    <script src="utils.js"></script>
    <script src="page-playbook.js"></script>
</body>
</html>
