# ── Ticker disambiguation (Codex finding #1) ──────────────────────────
# Naked-ticker match disabled for these. Only `$TICKER` cashtag accepted.
# 理由:這些 ticker 同時是常用英文詞,裸字會把整 sector polarity 污染。
ticker_extraction:
  naked_min_length: 3              # naked ticker 至少 3 字母 (除非在 high_liquidity_naked_whitelist)
  cashtag_required_pattern: "\\$([A-Z]{1,5})\\b"   # $TICKER always wins

  # ── High-liquidity naked whitelist (Codex fix #5) ───────────────────
  # 這些 ticker 即使是 cashtag-only / 短 / 跟 English word 衝突 (例如 X),也
  # 允許 naked match — 因為 retail 討論頻率太高,強制 $ prefix 會丟太多 signal。
  # V1 保守起手:只放 mega-cap meme / 高 retail 討論量的名稱。
  # 不放 GE / GM / KO 這種雖然真實但 retail 討論度沒那麼炸的。
  # 若某條跟 cashtag_only_tickers 同時出現,whitelist 優先 (允許 naked)。
  high_liquidity_naked_whitelist:
    - "NVDA"
    - "TSLA"
    - "AAPL"
    - "AMD"
    - "SMCI"
    - "PLTR"
    # v1.1 Gemini → Codex curated (skip META / COIN — 字義衝突風險)
    - "MSFT"
    - "AMZN"
    - "GOOG"
    - "GOOGL"
    - "NFLX"
    - "BABA"

  # 一律強制 cashtag(任何裸字都拒)。同時是 English word 或縮寫的 ticker。
