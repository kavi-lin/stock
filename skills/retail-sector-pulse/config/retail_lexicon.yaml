# ── Inclusion thresholds (V3.20.2 dual-gate per Codex review) ─────────
# Known-sector tickers (in TICKER_TO_SECTOR OR retail_only_sector_overrides):
#   relaxed gate — 1 mention OK,low engagement OK。
#   Reddit RSS fallback engagement=1.0,所以 known ticker 單篇 NVDA 可入。
# Unknown-sector tickers (sector mapping failed):
#   strict gate — 防止 long-tail 假 ticker (LONG/CALLS 即使 blocklist 漏掉也擋住) 進 sector。
ticker_inclusion:
  known_sector:
    min_mention_count: 1
    min_total_engagement: 1.0
  unknown_sector:
    min_mention_count: 3
    min_total_engagement: 8.0
  max_tickers_per_sector: 8     # sector rollup 只留 top 8 by engagement
  max_low_confidence_kept: 30   # low_confidence[] 保留前 30 給 audit

# ── Retail-only sector overrides (V3.20.2) ────────────────────────────
