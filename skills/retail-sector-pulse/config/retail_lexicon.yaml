# ── Truth Social filter (V3.20.3) ─────────────────────────────────────
# Trump 的 Truth Social posts 有公信力(他經濟決策直接影響市場),但大量是
# 純政治貼文 (Dumocrats endorsements, 對手攻擊) 應該過濾掉。
# Strategy:
#   1. Strip signature 防 DJT ticker 被誤抽 (大多是 "- President DJT" 簽名)
#   2. Relevance filter — post 必須含 macro topic keyword (fed/tariff/jobs/
#      inflation/recession/trade/ai/geopolitics/volatility/market_direction
#      或股票/經濟相關詞) 才保留,否則整篇 drop。
#
# Only applies to Truth Social source. Other sources unchanged.
truth_social_filter:
  enabled: true

  # Signature 撕除 patterns (regex,case-insensitive,在 ticker extraction 前套用)
  # 移除 "- President DJT" / "—DJT" / "President DJT" 結尾簽名
  signature_patterns:
    - "(?i)\\s*[—\\-–]?\\s*President\\s+DJT\\s*$"
    - "(?i)\\s*[—\\-–]\\s*DJT\\s*$"
    - "(?i)RT\\s+@\\s*realDonaldTrump"

  # Relevance filter — must hit one of these (case-insensitive substring) or
  # one of macro_wide.topic_lexicon entries. Otherwise drop entire post.
  # 額外經濟/股市詞彙 (不在 macro topic_lexicon 但 retail 視角相關):
  extra_relevance_keywords:
    - "economy"
    - "economic"
    - "market"
    - "markets"
    - "stock"
    - "stocks"
    - "earnings"
    - "tariff"
    - "tariffs"
    - "china"
    - "tax"
    - "taxes"
    - "tax cut"
    - "tax cuts"
    - "deal"
    - "dollar"
    - "oil"
    - "gold"
    - "bitcoin"
    - "crypto"
    - "doge"
    - "trade"
    - "jobs"
    - "wages"
    - "manufacturing"
    - "boeing"
    - "auto"
    - "energy"
    - "industry"
    - "wall street"
    - "federal reserve"
    - "powell"
    - "rates"
    - "interest"
    - "經濟"
    - "股市"
    - "關稅"
    - "貿易"

  # Drop post entirely if no relevance keyword AND no macro topic hit
  drop_if_irrelevant: true

# ── Market-wide buzz bucket (Codex finding #3) ────────────────────────
# 無 ticker 或 ticker 數 > 5 的 broad-market post 進這裡。
# 用 topic lexicon 粗分桶,顯在 radar 頂部 strip。
