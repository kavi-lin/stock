# retail-sector-pulse — V3.20.1 retail polarity lexicon
# Hand-curated bull / bear / macro-topic vocabulary for inferring
# retail-investor directional bias from Reddit / HN / Bluesky posts.
#
# 校 lexicon 流程:
#   1. 修詞後 bump `lexicon_version` (e.g. v1.0 → v1.1)
#   2. trending_tickers.py output 帶這個版本字串
#   3. 5/31 review 用 `lexicon_version` 區分 sample 來自哪版
#
# 不做 sarcasm / negation (V3.20.1 scope deferred to V3.20.2)。
# `sample_posts` 保留 matched_terms,讓用戶 audit lexicon 命中是否合理。
#
# Phrase matching rule (trending_tickers.py 實作):
#   - Match case-insensitive on post title + summary (NOT comments — token explosion)
#   - LONG PHRASE FIRST **+ SPAN MASKING** (★ critical, Codex finding):
#       1. Sort all candidate terms by len(term) DESC
#       2. Walk terms in order; when a term matches, MARK that text span as
#          consumed and skip overlapping matches afterwards
#       3. Example: "short squeeze" 命中 bull → mask "short squeeze" 區段 →
#          後面 bear list 的單字 "short" 在這個區段不再計分 → 不會互相抵消
#       4. 防 "pump and dump" → 不會 "pump"(bull) + "dump"(bear) 同篇 0 polarity
#   - Emoji 視為單 token,跟英文一樣計分
#   - Hit count: 一個 term 在同篇 post 多次出現,只算 1 hit (避免 spam 灌票)
#   - post polarity = (bull_hits - bear_hits) / (bull_hits + bear_hits + 1)
#     範圍 [-1, +1];中性 (兩邊 0 hits) → 0

lexicon_version: v1.3
revision_date: "2026-05-25"
notes: "v1.3 — V3.20.3 fix:lexicon 偏 WSB slang 對 wire-news 命中率 0。加 ~40 wire-news polarity terms (surge/plunge/downside/buying opportunity 等)。Truth Social Trump 簽名 \"President DJT\" 污染 ticker extraction → 加 truth_social_filter:strip signatures + relevance filter (post 須含 macro topic keyword 才保留,純政治 endorsement 整篇 drop)。"

